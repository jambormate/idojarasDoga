<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>idojarasdoga</title>
  </head>
  <body>
    <h1 class="text-center">Hőmérséklet adatok</h1>
    <form id="temperatureForm" class="mb-2">
      <div>
        <label for="temp" class="form-label">Hőmérséklet</label>
        <input type="number" id="temp" name="temp" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success mt-2">Mentés</button>
    </form>
    <table class="table table-bordered w-100">
      <thead>
        <tr>
          <th>A hét napja</th>
          <th>Hőmérséklet</th>
        </tr>
      </thead>
      <tbody id="content">
      </tbody>
    </table>
    <div>
      <button id="exportBtn" class="btn btn-warning mb-2">Export</button>
      <div>
        <textarea id="exportArea" class="form-control" rows="5"></textarea>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
